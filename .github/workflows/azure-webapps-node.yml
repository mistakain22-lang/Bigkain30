name: Azure Web App (Node)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment
        type: choice
        options: [Development, Production]
        default: Development
      use_oidc:
        description: Use OIDC (uncheck to use publish profile)
        type: boolean
        default: true

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install and build
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
            npm test --if-present
          else
            echo "No package.json; skipping npm"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'Development' }}
    permissions:
      contents: none
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure login (OIDC)
        if: ${{ github.event.inputs.use_oidc != 'false' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with OIDC
        if: ${{ github.event.inputs.use_oidc != 'false' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Deploy with publish profile
        if: ${{ github.event.inputs.use_oidc == 'false' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
